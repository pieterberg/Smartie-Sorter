# Project name:   Smartie Sorter 3000
# Workflow name:  arduino_compilation_test.yaml
# Created by:     Pieter van den Berg
# Created on:     14 April 2026
#
# A GitHub Actions workflow that uses the Arduino Compile Sketch action to 
# test whether the following sketches compile:
# 
#   1. smartie_sorter/smartie_sorter.ino 
#   2. enclosure_code/enclosure_code.ino 
#   3. management/management.ino 
#

name: Arduino Compilation Test
on: 
  - push
  - pull_request
  - workflow_dispatch
jobs:
  compile-sketch:
    runs-on: ubuntu-latest

    strategy:
      matrix:
       paths:
           - smartie_sorter
           - enclosure_code
           - management  
           
    steps:
     - name: Checkout the Smartie Sorter repository
       uses: actions/checkout@v6 
       
     - name: Test whether the Arduino sketches compile successfully
       uses: arduino/compile-sketches@v1
       with:
         fqbn: arduino:avr:nano
         sketch-paths: ${{ matrix.paths }}
         libraries: |
           # No libraries are required
           -

